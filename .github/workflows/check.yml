name: check

# A pull request runs its checks once (not again for the push of its own
# branch), in three parallel jobs: the static checks, the test suite and the
# production build. A push to main runs the same three on the merge commit;
# there is no fuller suite than this, so no daily run is needed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, types, lint and dead code share one install: each is seconds.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The one status a branch rule can require, whichever jobs ran.
  check:
    needs: [static, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
            if (bad.length) { console.error(`failed: ${bad.map(([name]) => name).join(", ")}`); process.exit(1); }
          '
