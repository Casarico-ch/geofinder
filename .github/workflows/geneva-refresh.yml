# Monthly Geneva data refresh: re-download the canton's layers, rebuild every
# plot's answer and our scores, run the audit regression tests and the server's
# golden-answer check, then push branch geneva/refresh and open an issue saying
# what changed, which new plans (if any) a person must read, and a one-click
# link to the pull request. Nothing ships until that pull request is merged.
# If any step fails, an issue says so. Run it by hand from the Actions tab too.
name: geneva-refresh

on:
  schedule:
    - cron: "17 4 3 * *" # the 3rd of each month, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: geneva-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow geopandas shapely pyogrio numpy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Keep the current data to compare against
        run: |
          cp geneva/data/parcels.parquet "$RUNNER_TEMP/prev.parquet"
          cp geneva/build/parcels/layers.json "$RUNNER_TEMP/prev_layers.json"
      - name: Rebuild the plot table from the canton's layers
        run: |
          python3 -I geneva/build/parcels/build.py --refresh --no-wait --prev "$RUNNER_TEMP/prev.parquet"
          cp geneva/work/layers.json geneva/build/parcels/layers.json
      - name: Our plot scores
        run: python3 -I geneva/build/scores.py
      - name: Export (stops if an audit regression test fails)
        run: python3 -I geneva/build/export.py
      - name: The server gives exactly the reference answers
        run: |
          pnpm check
          pnpm exec tsx scripts/check-geneva.ts
      - name: What changed
        run: python3 -I geneva/build/refresh_report.py "$RUNNER_TEMP/prev.parquet" "$RUNNER_TEMP/prev_layers.json" > "$RUNNER_TEMP/report.md"

      - name: Anything new? (the export date alone is not news)
        id: diff
        run: |
          if git diff --quiet -- geneva ':!geneva/data/schema.json'; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The organisation does not let Actions open pull requests (a setting locked above it,
      # 21.10), so the job pushes the branch and opens an issue with a one-click link to the PR.
      - name: Push the refresh branch and open an issue linking its pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.diff.outputs.month }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B geneva/refresh
          git add geneva/data geneva/build/parcels/layers.json
          git commit -q -m "Geneva data refresh $MONTH"
          git push -f origin geneva/refresh
          link="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...geneva/refresh?expand=1&title=Geneva%20data%20refresh%20$MONTH"
          { echo "**[Open the pull request]($link)** (one click: \"Create pull request\"), then merge it to ship this month's data."; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Geneva data refresh $MONTH ready" --body-file "$RUNNER_TEMP/issue.md"

      - name: Say so when the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Geneva data refresh failed ($(date -u +%Y-%m))" \
            --body "The monthly Geneva refresh stopped: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The app keeps serving last month's data until it is fixed."
